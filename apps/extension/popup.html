<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>ProofLens AI</title>
    <link rel="stylesheet" href="popup.css">
  </head>
  <body>
    <main>
      <header><span class="mark">P</span><div><b>ProofLens AI</b><small>Check before you trust.</small></div></header>
      <p id="page-address" class="page-address">Current page</p>
      <button id="check-page" class="primary">Check current page <span>↗</span></button>
      <button id="check-selection" class="secondary" disabled>Check selected text <span>↗</span></button>
      <p id="status" class="status" role="status">Your report opens in your ProofLens workspace.</p>
      <footer><button id="settings" type="button">Workspace settings</button></footer>
    </main>
    <script src="popup.js"></script>
  </body>
</html>
